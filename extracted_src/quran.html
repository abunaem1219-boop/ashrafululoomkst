    <title>আল-কুরআন — জামিয়া আরাবিয়া আশরাফুল উলূম কুষ্টিয়া</title>

    <style>
        :root {
            --arabic-font: 'Amiri', serif;
        }
        
        /* ট্যাব বাটন */
        .quran-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }
        .quran-tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .quran-tab-btn.active {
            background: var(--primary);
            color: white;
        }

        /* সার্চ বার */
        .search-container {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .search-container input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            font-family: 'Hind Siliguri', sans-serif;
            transition: border-color 0.3s;
        }
        .search-container input:focus {
            border-color: var(--primary);
        }
        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        /* সূরা কার্ড গ্রিড */
        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 3rem;
        }
        .surah-card {
            background: white;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid var(--border);
        }
        .surah-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .surah-info-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .surah-number-design {
            width: 40px;
            height: 40px;
            background: rgba(5, 108, 70, 0.1);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px dashed var(--primary);
        }
        .surah-details h3 {
            font-size: 1.1rem;
            margin-bottom: 2px;
            color: var(--text-main);
        }
        .surah-details p {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .surah-info-right {
            text-align: right;
        }
        .surah-arabic-name {
            font-family: var(--arabic-font);
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 700;
        }
        .type-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-top: 5px;
            font-weight: 500;
        }
        .type-maki { background: #e3f2fd; color: #0d47a1; }
        .type-madani { background: #e8f5e9; color: #1b5e20; }

        /* রিডার ভিউ */
        .reader-view {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            margin-bottom: 3rem;
        }
        .reader-header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        /* প্রিমিয়াম সূরা প্লেয়ার উইজেট */
        .surah-player-box {
            background: rgba(5, 108, 70, 0.05);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin: 15px auto;
            max-width: 500px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s, transform 0.1s;
        }
        .player-btn:active { transform: scale(0.95); }
        .player-info {
            flex-grow: 1;
            text-align: left;
        }
        .player-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
        }
        .player-progress-bar {
            width: 100%;
            height: 5px;
            background: var(--border);
            border-radius: 5px;
            margin-top: 6px;
            position: relative;
            cursor: pointer;
        }
        .player-progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
            transition: width 0.1s linear;
        }

        .bismillah {
            font-family: var(--arabic-font);
            font-size: 2rem;
            color: var(--text-main);
            text-align: center;
            margin: 20px 0;
            direction: rtl;
        }
        
        /* সেটিংস প্যানেল */
        .reader-settings {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--bg-color);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: space-between;
        }
        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .setting-item input[type="range"] {
            width: 80px;
            accent-color: var(--primary);
        }

        /* আয়াত তালিকা */
        .ayah-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .ayah-card {
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }
        .ayah-card:last-child {
            border-bottom: none;
        }
        .ayah-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .ayah-actions {
            display: flex;
            gap: 10px;
        }
        .ayah-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }
        .ayah-btn:hover, .ayah-btn.active {
            color: var(--primary);
        }
        .ayah-arabic {
            font-family: var(--arabic-font);
            font-size: 1.8rem;
            line-height: 2.2;
            color: #1a1a1a;
            text-align: right;
            direction: rtl;
            margin-bottom: 10px;
            word-wrap: break-word;
        }
        .ayah-bangla {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-main);
        }
        
        /* ব্যাক বাটন */
        .back-to-list-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        /* লোডার */
        .spinner-container {
            display: none;
            text-align: center;
            padding: 3rem 0;
        }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

    const transMap = { '0':'০', '1':'১', '2':'২', '3':'৩', '4':'৪', '5':'৫', '6':'৬', '7':'৭', '8':'৮', '9':'৯' };
    function toBanglaNum(n) { return String(n).split('').map(c => transMap[c] || c).join(''); }

    let currentTab = 'all';
    let bookmarks = JSON.parse(localStorage.getItem('quran_bookmarks') || '[]');
    let currentAudio = null;
    let playingAyahKey = null;

    let surahAudio = null;
    let isSurahPlaying = false;
    let currentSurahIdForAudio = null;

    // সূরার তালিকা রেন্ডার করা
    function renderSurahGrid(list) {
        const grid = document.getElementById('surah-grid');
        grid.innerHTML = '';
        if(list.length === 0) {
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--text-light); padding: 2rem 0;">কোন সূরা পাওয়া যায়নি।</p>`;
            return;
        }

        list.forEach(s => {
            const isBookmarked = bookmarks.includes(s.id);
            const card = document.createElement('div');
            card.className = 'surah-card';
            card.onclick = () => loadSurah(s.id);
            card.innerHTML = `
                <div class="surah-info-left">
                    <div class="surah-number-design">${toBanglaNum(s.id)}</div>
                    <div class="surah-details">
                        <h3>${s.name}</h3>
                        <p>${s.trans} • আয়াত: ${toBanglaNum(s.ayahs)}</p>
                    </div>
                </div>
                <div class="surah-info-right">
                    <div class="surah-arabic-name">${s.ar}</div>
                    <span class="type-badge ${s.type === 'Makkah' ? 'type-maki' : 'type-madani'}">
                        ${s.type === 'Makkah' ? 'মাক্কী' : 'মাদানী'}
                    </span>
                    ${isBookmarked ? '<i class="fas fa-bookmark" style="color:var(--primary); margin-left:8px; font-size:0.9rem;"></i>' : ''}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // ফিল্টারিং ফাংশন
    function filterSurahs() {
        const query = document.getElementById('search-input').value.toLowerCase();
        let sourceList = currentTab === 'all' ? surahList : surahList.filter(s => bookmarks.includes(s.id));
        
        const filtered = sourceList.filter(s => 
            s.name.toLowerCase().includes(query) || 
            s.trans.toLowerCase().includes(query) || 
            s.id.toString() === query
        );
        renderSurahGrid(filtered);
    }

    // ট্যাব পরিবর্তন
    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-all').classList.toggle('active', tab === 'all');
        document.getElementById('tab-bookmarks').classList.toggle('active', tab === 'bookmarks');
        document.getElementById('search-input').value = '';
        
        if(tab === 'bookmarks') {
            const bookmarkedSurahs = surahList.filter(s => bookmarks.includes(s.id));
            renderSurahGrid(bookmarkedSurahs);
        } else {
            renderSurahGrid(surahList);
        }
    }

    // সূরা লোড করা (API-এর মাধ্যমে)
    async function loadSurah(id) {
        stopAudio();
        stopSurahAudio();
        
        const loader = document.getElementById('api-loader');
        const reader = document.getElementById('quran-reader');
        const listView = document.getElementById('surah-list-view');

        listView.style.display = 'none';
        reader.style.display = 'none';
        loader.style.display = 'block';

        const sInfo = surahList.find(s => s.id === id);
        currentSurahIdForAudio = id;
        
        // প্লেয়ার উইজেট আপডেট
        document.getElementById('player-surah-title').innerText = `${sInfo.name} (সম্পূর্ণ সূরা তিলাওয়াত)`;
        resetSurahPlayerUI();

        // বিসমিল্লাহ ব্লক দেখানো বা লুকানো (সূরা তওবা ব্যতীত)
        const bismillahBlock = document.getElementById('bismillah-block');
        if (id === 9) {
            bismillahBlock.style.display = 'none';
        } else {
            bismillahBlock.style.display = 'block';
        }

        try {
            // একসাথে আরবি ও বাংলা অনুবাদ এপিআই কল
            const [arRes, bnRes] = await Promise.all([
                fetch(`https://api.alquran.cloud/v1/surah/${id}`),
                fetch(`https://api.alquran.cloud/v1/surah/${id}/bn.bengali`)
            ]);

            const arData = await arRes.json();
            const bnData = await bnRes.json();

            if(arData.code === 200 && bnData.code === 200) {
                renderReader(sInfo, arData.data.ayahs, bnData.data.ayahs);
                loader.style.display = 'none';
                reader.style.display = 'block';
            } else {
                alert('তথ্য লোড করতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।');
                backToList();
            }
        } catch (error) {
            console.error(error);
            alert('ইন্টারনেট সংযোগ চেক করে পুনরায় চেষ্টা করুন।');
            backToList();
        }
    }

    // রিডার ইন্টারফেস রেন্ডারিং
    function renderReader(info, arAyahs, bnAyahs) {
        const isBookmarked = bookmarks.includes(info.id);
        const header = document.getElementById('reader-header');
        header.innerHTML = `
            <h2 style="color:var(--primary); font-size:1.8rem;">${info.name}</h2>
            <p style="color:var(--text-light); margin-top:5px;">${info.trans} • ${info.ar} • আয়াত সংখ্যা: ${toBanglaNum(info.ayahs)}</p>
            <button class="ayah-btn" style="margin-top:10px; font-size:1.1rem; color: ${isBookmarked ? 'var(--primary)' : 'var(--text-light)'}" onclick="toggleBookmark(${info.id}, this)">
                <i class="${isBookmarked ? 'fas' : 'far'} fa-bookmark"></i> ${isBookmarked ? 'বুকমার্ক করা হয়েছে' : 'বুকমার্ক করুন'}
            </button>
        `;

        const listContainer = document.getElementById('ayah-list');
        listContainer.innerHTML = '';

        arAyahs.forEach((ayah, index) => {
            const bnAyah = bnAyahs[index];
            let arText = ayah.text;
            
            // প্রথম আয়াতের সুরার শুরু থেকে বিসমিল্লাহ বাদ দিয়ে দেখানো
            if (index === 0 && info.id !== 1 && info.id !== 9) {
                if (arText.startsWith('بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ')) {
                    arText = arText.replace('بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', '').trim();
                }
            }

            const ayahCard = document.createElement('div');
            ayahCard.className = 'ayah-card';
            ayahCard.id = `ayah-card-${ayah.number}`;
            ayahCard.innerHTML = `
                <div class="ayah-top">
                    <span class="surah-number-design" style="width:30px; height:30px; font-size:0.8rem;">${toBanglaNum(index + 1)}</span>
                    <div class="ayah-actions">
                        <!-- বিশ্বস্ত গ্লোবাল এবং ফাস্ট cdn.islamic.network থেকে আয়াত ভিত্তিক অডিও প্লেব্যাক -->
                        <button class="ayah-btn" id="audio-btn-${ayah.number}" onclick="playAyahAudio('${ayah.number}', 'https://cdn.islamic.network/quran/audio/128/ar.alafasy/${ayah.number}.mp3')" title="তিলওয়াত শুনুন">
                            <i class="fas fa-play"></i>
                        </button>
                    </div>
                </div>
                <div class="ayah-arabic">${arText}</div>
                <div class="ayah-bangla">${bnAyah.text}</div>
            `;
            listContainer.appendChild(ayahCard);
        });
    }

    // বুকমার্ক টগল
    function toggleBookmark(id, btn) {
        if(bookmarks.includes(id)) {
            bookmarks = bookmarks.filter(b => b !== id);
            btn.innerHTML = `<i class="far fa-bookmark"></i> বুকমার্ক করুন`;
            btn.style.color = 'var(--text-light)';
        } else {
            bookmarks.push(id);
            btn.innerHTML = `<i class="fas fa-bookmark"></i> বুকমার্ক করা হয়েছে`;
            btn.style.color = 'var(--primary)';
        }
        localStorage.setItem('quran_bookmarks', JSON.stringify(bookmarks));
        if(currentTab === 'bookmarks') {
            const bookmarkedSurahs = surahList.filter(s => bookmarks.includes(s.id));
            renderSurahGrid(bookmarkedSurahs);
        }
    }

    // ব্যাক টু লিস্ট
    function backToList() {
        stopAudio();
        stopSurahAudio();
        document.getElementById('quran-reader').style.display = 'none';
        document.getElementById('api-loader').style.display = 'none';
        document.getElementById('surah-list-view').style.display = 'block';
        if(currentTab === 'bookmarks') {
            switchTab('bookmarks');
        } else {
            renderSurahGrid(surahList);
        }
    }

    // ফন্ট সাইজ নিয়ন্ত্রণ
    function changeFontSize(type, val) {
        if(type === 'arabic') {
            document.querySelectorAll('.ayah-arabic').forEach(el => el.style.fontSize = val + 'px');
        } else {
            document.querySelectorAll('.ayah-bangla').forEach(el => el.style.fontSize = val + 'px');
        }
    }

    // অনুবাদ প্রদর্শন টগল
    function toggleTranslation(visible) {
        document.querySelectorAll('.ayah-bangla').forEach(el => {
            el.style.display = visible ? 'block' : 'none';
        });
    }

    // নির্দিষ্ট আয়াত প্লে ফাংশন (গ্লোবাল স্টেবল এবং সুপার ফাস্ট CDN)
    function playAyahAudio(ayahId, audioUrl) {
        stopSurahAudio(); // সুরা অডিও বন্ধ করা

        if (currentAudio && playingAyahKey === ayahId) {
            stopAudio();
            return;
        }

        stopAudio();

        currentAudio = new Audio(audioUrl);
        playingAyahKey = ayahId;

        const btn = document.getElementById(`audio-btn-${ayahId}`);
        if(btn) btn.innerHTML = `<i class="fas fa-pause"></i>`;

        currentAudio.play();

        currentAudio.onended = () => {
            stopAudio();
        };

        currentAudio.onerror = () => {
            alert('অডিও ফাইলটি লোড করা সম্ভব হয়নি।');
            stopAudio();
        };
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            const btn = document.getElementById(`audio-btn-${playingAyahKey}`);
            if(btn) btn.innerHTML = `<i class="fas fa-play"></i>`;
            currentAudio = null;
            playingAyahKey = null;
        }
    }


    /* ========================================================
       সমগ্র সূরা ভিত্তিক অডিও প্লেয়ার কন্ট্রোলার (প্রিমিয়াম স্টাইল)
       ======================================================== */

    function toggleSurahAudio() {
        stopAudio(); // একক আয়াত অডিও বন্ধ করা

        if (!currentSurahIdForAudio) return;

        const padId = String(currentSurahIdForAudio).padStart(3, '0');
        
        // অনলাইন ফাস্ট CDN লিংক (mp3quran সার্ভার)। 
        // আপনি অফলাইনে আপনার ফোল্ডার থেকে চালাতে চাইলে নিচের লাইনে `audio/${padId}.mp3` লিখে ফাইল মেমোরিতে সেভ রাখতে পারেন।
        const surahUrl = `https://server8.mp3quran.net/afs/${padId}.mp3`;

        const playBtn = document.getElementById('surah-play-btn');

        if (isSurahPlaying) {
            surahAudio.pause();
            isSurahPlaying = false;
            playBtn.innerHTML = `<i class="fas fa-play"></i>`;
        } else {
            if (!surahAudio) {
                surahAudio = new Audio(surahUrl);
                
                // প্রোগ্রেস বার রেন্ডারিং লিসেনার
                surahAudio.ontimeupdate = () => {
                    if (surahAudio) {
                        const progress = (surahAudio.currentTime / surahAudio.duration) * 100;
                        document.getElementById('player-progress-fill').style.width = `${progress}%`;
                    }
                };

                surahAudio.onended = () => {
                    stopSurahAudio();
                };

                surahAudio.onerror = () => {
                    alert('সূরার সম্পূর্ণ অডিও ফাইলটি লোড করা সম্ভব হয়নি।');
                    stopSurahAudio();
                };
            }
            
            surahAudio.play();
            isSurahPlaying = true;
            playBtn.innerHTML = `<i class="fas fa-pause"></i>`;
        }
    }

    // অডিও টেনে আগে-পিছে করার ফাংশন
    function seekSurahAudio(event) {
        if (!surahAudio) return;
        const progressBar = document.getElementById('player-progress-bar');
        const rect = progressBar.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const width = rect.width;
        const percentage = clickX / width;
        surahAudio.currentTime = percentage * surahAudio.duration;
    }

    function stopSurahAudio() {
        if (surahAudio) {
            surahAudio.pause();
            surahAudio = null;
        }
        isSurahPlaying = false;
        resetSurahPlayerUI();
    }

    function resetSurahPlayerUI() {
        document.getElementById('surah-play-btn').innerHTML = `<i class="fas fa-play"></i>`;
        document.getElementById('player-progress-fill').style.width = `0%`;
    }

    // প্রথমবার পেজ লোড হবার কাজ
    document.addEventListener('DOMContentLoaded', () => {
        renderSurahGrid(surahList);
    });

    // ===== SHARED PAGE JS =====
    function navigateTo(url) { if(window.location.href.includes(url.split('#')[0])) return; const ov = document.getElementById('page-transition-overlay'); if(ov) { ov.classList.remove('loaded'); setTimeout(() => { window.location.href = url; }, 250); } else { window.location.href = url; } }
    function handleNavClick(url, el) { const rip = document.createElement('span'); rip.className = 'ripple-circle'; el.appendChild(rip); setTimeout(() => { if(rip.parentNode) rip.parentNode.removeChild(rip); }, 550); navigateTo(url); }
    document.addEventListener('DOMContentLoaded', () => { const ham = document.getElementById('hamburger'); const nav = document.getElementById('nav-links'); if(ham && nav) { ham.addEventListener('click', (e) => { e.stopPropagation(); nav.classList.toggle('active'); document.body.classList.toggle('drawer-open'); }); document.addEventListener('click', (e) => { if(!nav.contains(e.target) && !ham.contains(e.target)) { nav.classList.remove('active'); document.body.classList.remove('drawer-open'); } }); } });
    window.addEventListener('DOMContentLoaded', () => { const ov = document.getElementById('page-transition-overlay'); if(ov) setTimeout(() => { ov.classList.add('loaded'); }, 150); });
</script>

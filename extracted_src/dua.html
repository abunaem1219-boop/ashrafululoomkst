    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* সালাত ও দোয়া পেজের প্রিমিয়াম থিম স্টাইল */
        
        /* সার্চ বার */
        .search-container {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .search-container input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            font-family: 'Hind Siliguri', sans-serif;
            transition: border-color 0.3s;
        }
        .search-container input:focus {
            border-color: var(--primary);
        }
        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        /* ক্যাটাগরি স্লাইডার */
        .dua-tabs {
            display: flex;
            background: rgba(5, 108, 70, 0.06);
            padding: 5px;
            border-radius: 12px;
            gap: 4px;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }
        .dua-tabs::-webkit-scrollbar {
            display: none; /* Safari/Chrome */
        }
        .dua-tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px 15px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.25s ease;
            text-align: center;
            white-space: nowrap;
        }
        .dua-tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(5, 108, 70, 0.2);
        }

        @media (min-width: 480px) {
            .dua-tab-btn {
                font-size: 0.95rem;
            }
        }

        /* দুআ কার্ড ডিজাইন */
        .dua-card {
            background: white;
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .dua-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(5, 108, 70, 0.1);
        }
        .dua-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 10px;
            margin-bottom: 1.2rem;
        }
        .dua-title {
            color: var(--primary);
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dua-fav-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s, transform 0.2s;
            padding: 5px;
        }
        .dua-fav-btn:hover {
            color: #e91e63;
            transform: scale(1.1);
        }
        .dua-fav-btn.active {
            color: #e91e63;
        }

        .dua-arabic {
            font-family: 'Amiri', serif;
            font-size: 1.7rem;
            line-height: 2.1;
            color: #1a1a1a;
            text-align: right;
            direction: rtl;
            margin: 1.2rem 0;
            word-wrap: break-word;
        }
        
        .dua-translation-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 1.2rem;
        }
        .dua-meta-item {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
        }
        .dua-meta-item strong {
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
        }

        /* ফজিলত ও নিয়ম কানুন বক্স */
        .dua-virtue-box {
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-main);
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .dua-virtue-box i {
            color: #D4AF37;
            font-size: 1.1rem;
            margin-top: 3px;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

            pronunciation: "রব্বির হামহুমা কামা রব্বায়ানী সগীরা।",
            meaning: "হে আমার প্রতিপালক! তাদের প্রতি দয়া করুন যেভাবে তারা শৈশবে আমাকে দয়া ও স্নেহে লালন-পালন করেছিলেন।",
            virtue: "কুরআনে বর্ণিত পিতা-মাতার জন্য সর্বশ্রেষ্ঠ দোয়া। এটি সন্তানদের জন্য পিতা-মাতার জীবদ্দশায় ও মৃত্যুর পরে পড়ার পরম দায়িত্ব।"
        }
    ];

    let favorites = JSON.parse(localStorage.getItem('dua_favorites') || '[]');
    let currentCategory = 'all';

    // দোয়া তালিকা রেন্ডার করার জন্য ডাইনামিক ফাংশন
    function renderDuas(targetContainerId, list) {
        const container = document.getElementById(targetContainerId);
        container.innerHTML = '';
        
        if (list.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:var(--text-light); padding: 3rem 0;">কোনো দোয়া পাওয়া যায়নি।</p>`;
            return;
        }

        list.forEach(dua => {
            const isFav = favorites.includes(dua.id);
            const card = document.createElement('div');
            card.className = 'dua-card';
            card.innerHTML = `
                <div class="dua-header">
                    <div class="dua-title">
                        <i class="fas fa-hand-holding-heart"></i> ${dua.title}
                    </div>
                    <button class="dua-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, ${dua.id})" title="পছন্দের তালিকায় রাখুন">
                        <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
                    </button>
                </div>
                <div class="dua-arabic">${dua.arabic}</div>
                <div class="dua-translation-block">
                    <div class="dua-meta-item">
                        <strong>উচ্চারণ:</strong> ${dua.pronunciation}
                    </div>
                    <div class="dua-meta-item">
                        <strong>অর্থ:</strong> ${dua.meaning}
                    </div>
                </div>
                <div class="dua-virtue-box">
                    <i class="fas fa-info-circle"></i>
                    <div><strong>ফজিলত ও নিয়ম:</strong> ${dua.virtue}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // রিয়েল-টাইম সার্চ এবং ফিল্টার
    function filterDuas() {
        const query = document.getElementById('search-input').value.toLowerCase();
        let sourceList = duaList;

        // যদি অল ছাড়া অন্য কোনো ক্যাটাগরিতে থাকে
        if (currentCategory !== 'all') {
            sourceList = duaList.filter(d => d.category === currentCategory);
        }

        const filtered = sourceList.filter(d => 
            d.title.toLowerCase().includes(query) || 
            d.meaning.toLowerCase().includes(query) || 
            d.pronunciation.toLowerCase().includes(query)
        );
        renderDuas('dua-list-container', filtered);
    }

    // প্রিয় তালিকা বুকমার্ক টগল
    function toggleFavorite(event, id) {
        event.stopPropagation();
        if (favorites.includes(id)) {
            favorites = favorites.filter(f => f !== id);
        } else {
            favorites.push(id);
        }
        localStorage.setItem('dua_favorites', JSON.stringify(favorites));
        
        // রেন্ডার আপডেট
        filterDuas();
        if(currentCategory === 'favorites') {
            const favList = duaList.filter(d => favorites.includes(d.id));
            renderDuas('favorites-list-container', favList);
        }
    }

    // ট্যাব পরিবর্তন
    function switchTab(tabId) {
        currentCategory = tabId;
        
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        document.querySelectorAll('.dua-tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        // বাটন ও কন্টেন্ট একটিভ করা
        if (tabId === 'favorites') {
            document.getElementById('tab-favorites').classList.add('active');
            const favList = duaList.filter(d => favorites.includes(d.id));
            renderDuas('favorites-list-container', favList);
        } else {
            document.getElementById('tab-all').classList.add('active');
            document.getElementById('search-input').value = '';
            
            let list = duaList;
            if (tabId !== 'all') {
                list = duaList.filter(d => d.category === tabId);
            }
            renderDuas('dua-list-container', list);
        }

        const event = window.event;
        if(event && event.target) {
            event.target.classList.add('active');
        } else {
            const targetBtn = Array.from(document.querySelectorAll('.dua-tab-btn')).find(btn => btn.getAttribute('onclick').includes(tabId));
            if(targetBtn) targetBtn.classList.add('active');
        }
    }

    // ইনিশিয়াল প্রথমবার লোড
    document.addEventListener('DOMContentLoaded', () => {
        renderDuas('dua-list-container', duaList);
    });

    // ===== SHARED PAGE JS =====
    function navigateTo(url) { if(window.location.href.includes(url.split('#')[0])) return; const ov = document.getElementById('page-transition-overlay'); if(ov) { ov.classList.remove('loaded'); setTimeout(() => { window.location.href = url; }, 250); } else { window.location.href = url; } }
    function handleNavClick(url, el) { const rip = document.createElement('span'); rip.className = 'ripple-circle'; el.appendChild(rip); setTimeout(() => { if(rip.parentNode) rip.parentNode.removeChild(rip); }, 550); navigateTo(url); }
    document.addEventListener('DOMContentLoaded', () => { const ham = document.getElementById('hamburger'); const nav = document.getElementById('nav-links'); if(ham && nav) { ham.addEventListener('click', (e) => { e.stopPropagation(); nav.classList.toggle('active'); document.body.classList.toggle('drawer-open'); }); document.addEventListener('click', (e) => { if(!nav.contains(e.target) && !ham.contains(e.target)) { nav.classList.remove('active'); document.body.classList.remove('drawer-open'); } }); } });
    window.addEventListener('DOMContentLoaded', () => { const ov = document.getElementById('page-transition-overlay'); if(ov) setTimeout(() => { ov.classList.add('loaded'); }, 150); });
</script>
</body>
</html>
